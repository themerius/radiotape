[project]
name = "radiotape"
version = "0.1.0"
description = "Record Apple Music like taping from the radio"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "audioop-lts>=0.2.2",
    "click>=8.3.1",
    "mutagen>=1.47.0",
    "numpy>=2.4.3",
    "pydub>=0.25.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
]

[project.scripts]
radiotape = "radiotape.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radiotape"]
